name: "ECR Release Workflow"

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: public.ecr.aws/b8k9c8n5/openmind/ota
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push AMD64 image by tag
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-arm64:
    runs-on: ubuntu-22.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      metadata: ${{ steps.meta.outputs.json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: public.ecr.aws/b8k9c8n5/openmind/ota
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ARM64 image by tag
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-manifest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      deployments: write
    needs: [ build-amd64, build-arm64 ]
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      url: https://gallery.ecr.aws/b8k9c8n5/openmind/ota
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Create manifest list and push
        run: |
          if [[ -z "${{ needs.build-amd64.outputs.image-digest }}" ]]; then
            echo "Error: AMD64 digest is empty"
            exit 1
          fi

          if [[ -z "${{ needs.build-arm64.outputs.image-digest }}" ]]; then
            echo "Error: ARM64 digest is empty"
            exit 1
          fi

          # Get the metadata from amd64 build to extract tags
          tags=$(echo '${{ needs.build-amd64.outputs.metadata }}' | jq -r '.tags[]')

          # Create manifest for each tag
          for tag in $tags; do
            echo "Creating manifest for: $tag"

            docker buildx imagetools create \
              --tag $tag \
              public.ecr.aws/b8k9c8n5/openmind/ota@${{ needs.build-amd64.outputs.image-digest }} \
              public.ecr.aws/b8k9c8n5/openmind/ota@${{ needs.build-arm64.outputs.image-digest }}
          done

  build-terminal:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    outputs:
      build-timestamp: ${{ steps.ts.outputs.ts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compute build timestamp
        id: ts
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build terminal binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w -X github.com/OpenMind/OM1-OTA/internal/version.BuildTimestamp=${{ steps.ts.outputs.ts }}" \
            -o terminal-linux-${{ matrix.arch }} ./cmd/terminal

      - name: Compute checksum
        id: sum
        run: echo "sum=$(sha256sum terminal-linux-${{ matrix.arch }} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload binary to S3
        run: |
          aws s3 cp terminal-linux-${{ matrix.arch }} \
            s3://openmind-assets/ota/terminal/${{ steps.ts.outputs.ts }}/terminal-linux-${{ matrix.arch }}

      - name: Write manifest fragment
        run: |
          cat <<EOF > manifest-${{ matrix.arch }}.json
          {
            "build_timestamp": "${{ steps.ts.outputs.ts }}",
            "url": "https://assets.openmind.com/ota/terminal/${{ steps.ts.outputs.ts }}/terminal-linux-${{ matrix.arch }}",
            "checksum": "${{ steps.sum.outputs.sum }}",
            "checksum_algorithm": "sha256"
          }
          EOF

      - name: Upload manifest fragment artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-manifest-${{ matrix.arch }}
          path: manifest-${{ matrix.arch }}.json

  publish-terminal-manifest:
    runs-on: ubuntu-latest
    needs: [ build-terminal ]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: terminal-manifest-*
          merge-multiple: true

      - name: Assemble schema.json
        run: |
          python3 - <<'PY'
          import json, glob, datetime

          builds = {}
          for path in glob.glob("manifest-*.json"):
              arch = path.removeprefix("manifest-").removesuffix(".json")
              builds[f"linux/{arch}"] = json.load(open(path))

          out = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "builds": builds,
          }
          json.dump(out, open("schema.json", "w"), indent=2)
          PY
          cat schema.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload schema.json
        run: |
          aws s3 cp schema.json s3://openmind-assets/ota/terminal/schema.json \
            --cache-control "no-cache" --content-type "application/json"
